<!doctype html>
<!-- Nền dọc 1080×1920 cho Shorts cắt từ phim chính. Khung phim 16:9 được ffmpeg đặt đè vào ô #khung (y = 592).
     Tham số URL: h1, h2 (câu hỏi, 2 dòng), the (thẻ đỏ), ket=1 (thẻ kết «xem trọn phim»), phim, kenh (tên phim, tên kênh trên thẻ kết), kieu=vuong (1080×1080).
     Vùng an toàn Shorts: đáy 420 px và lề phải 120 px dành cho nút; chữ không đặt ở đó. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Osw;src:url(Oswald-VF.ttf)}
@font-face{font-family:BVPX;src:url(BeVietnamPro-ExtraBold.ttf)}
@font-face{font-family:BVP;src:url(BeVietnamPro-SemiBold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#3a4126;position:relative}
.nen{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%,rgba(0,0,0,0) 0%,rgba(0,0,0,.45) 100%),
    repeating-linear-gradient(0deg,rgba(235,228,200,.035) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(90deg,rgba(235,228,200,.035) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.tag{position:absolute;left:60px;top:250px;padding:8px 16px 9px;background:#d8312a;color:#f4ecdc;
  font:800 26px/1 BVPX;letter-spacing:.06em}
.h{position:absolute;left:60px;right:60px;top:312px;font:700 92px/1.12 Osw;color:#e2b04a;
  text-transform:uppercase;white-space:nowrap}
.h span{display:block}
#khung{position:absolute;left:0;top:592px;width:1080px;height:608px;background:#000;
  box-shadow:0 0 0 2px rgba(226,176,74,.55),0 18px 40px rgba(0,0,0,.5)}
.ket{position:absolute;left:60px;right:180px;top:1250px;display:none;color:#f4ecdc;font:600 40px/1.35 BVP}
.ket b{display:block;color:#e2b04a;font:700 64px/1.15 Osw;text-transform:uppercase;margin-top:10px}
body.co-ket .ket{display:block}
/* Khung vuông 1080×1080 (kieu=vuong): khung phim ở y = 236 */
body.vuong{height:1080px}
body.vuong .tag{top:40px;font-size:22px}
body.vuong .h{top:86px;font-size:64px}
body.vuong #khung{top:236px}
body.vuong .ket{top:860px;font-size:30px}
body.vuong .ket b{font-size:46px;margin-top:4px}
</style></head><body>
<div class="nen"></div>
<div class="tag" id="tag"></div>
<div class="h"><span id="h1"></span><span id="h2"></span></div>
<div id="khung"></div>
<div class="ket">Xem trọn phim<b id="ket-phim">TÊN PHIM</b>trên kênh <span id="ket-kenh">TÊN KÊNH</span></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('h1').textContent=q.get('h1')||'';
document.getElementById('h2').textContent=q.get('h2')||'';
document.getElementById('tag').textContent=q.get('the')||'TÊN TẬP · NĂM';
if(q.get('ket')==='1')document.body.classList.add('co-ket');
if(q.get('phim'))document.getElementById('ket-phim').textContent=q.get('phim');
if(q.get('kenh'))document.getElementById('ket-kenh').textContent=q.get('kenh');
const vuong=q.get('kieu')==='vuong';if(vuong)document.body.classList.add('vuong');
document.fonts.ready.then(()=>{const h=document.querySelector('.h');let s=vuong?64:92;
  while(s>40&&Math.max(...[...h.querySelectorAll('span')].map(e=>e.getBoundingClientRect().width))>960){s-=2;h.style.fontSize=s+'px';}});
</script></body></html>
