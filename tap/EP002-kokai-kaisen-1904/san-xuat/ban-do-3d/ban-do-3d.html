function trail(){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(40*3),3));geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(40*3),3));const l=new THREE.Line(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true}));l.frustumCulled=false;l.visible=false;sc.add(l);return l;}

  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity}));m.frustumCulled=false;sc.add(m);m.userData.total=geo.index.count;m.userData.curve=c;return m;}

function uTurn(A,B,R,L3){const h0=Math.atan2(B[1]-A[1],B[0]-A[0]);const L1=Math.hypot(B[0]-A[0],B[1]-A[1]),ARC=Math.PI*R;const C=[B[0]-Math.sin(h0)*R,B[1]+Math.cos(h0)*R];
  return {C,L1,at(s){if(s<=L1)return [A[0]+Math.cos(h0)*s,A[1]+Math.sin(h0)*s,h0];
    if(s<=L1+ARC){const a=(s-L1)/R,th=h0-Math.PI/2+a;return [C[0]+Math.cos(th)*R,C[1]+Math.sin(th)*R,h0+a];}
    const h1=h0+Math.PI,P=[C[0]+Math.cos(h0+Math.PI/2)*R,C[1]+Math.sin(h0+Math.PI/2)*R],d=s-L1-ARC;return [P[0]+Math.cos(h1)*d,P[1]+Math.sin(h1)*d,h1];}};}

function turnPath(A,h0,L1,R,dth){const sg=dth>=0?1:-1,arc=R*Math.abs(dth);
  const B=[A[0]+Math.cos(h0)*L1,A[1]+Math.sin(h0)*L1],C=[B[0]-Math.sin(h0)*R*sg,B[1]+Math.cos(h0)*R*sg],th0=h0-sg*Math.PI/2;
