<style>html,body{margin:0;background:#111;overflow:hidden}</style></head><body>
<script>window.READY=false;window.SIZE='1920x1080';window.DURATION=6;</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const W=1920,H=1080;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.setPixelRatio(1);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x111111);sc.fog=new THREE.FogExp2(0x111111,0.55);

const L=new GLTFLoader();
function load(u){return new Promise((res,rej)=>L.load(u,g=>res(g.scene),undefined,rej));}
const [a,b]=await Promise.all([load('tau-thiet-giap.glb'),load('tau-phong-loi.glb')]);

  r.render(sc,cam);return null;};
window.renderFrame(0);window.READY=true;
</script></body></html>
